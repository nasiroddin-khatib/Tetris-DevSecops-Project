---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tetris
  namespace: default

spec:
  replicas: 3
  selector:
    matchLabels:
      app: tetris

  template:
    metadata:
      labels:
        app: tetris

    spec:
      containers:
      - name: tetris
        image: nasir590/tetrisv1:latest

        ports:
        - containerPort: 3000

---
apiVersion: v1
kind: Service

metadata:
  name: tetris-service
  namespace: default

spec:
  selector:
    app: tetris

  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000

  type: LoadBalancer
